spring.application.name=justock-api

spring.config.import=optional:file:./application-local.properties

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driverClassName=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true



spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

mercadolivre.client.id=${MERCADOLIVRE_CLIENT_ID}
mercadolivre.client.secret=${MERCADOLIVRE_CLIENT_SECRET}
mercadolivre.redirect.uri=${MERCADOLIVRE_REDIRECT_URI}
mercadolivre.frontend.redirect-uri=${MERCADOLIVRE_FRONTEND_REDIRECT_URI:http://localhost:5173/conexoes}
mercadolivre.shared.usuario-id=${MERCADOLIVRE_SHARED_USUARIO_ID:1}
mercadolivre.auto-sync.enabled=${MERCADOLIVRE_AUTO_SYNC_ENABLED:true}
mercadolivre.auto-sync.fixed-delay-ms=${MERCADOLIVRE_AUTO_SYNC_FIXED_DELAY_MS:600000}
mercadolivre.auto-sync.initial-delay-ms=${MERCADOLIVRE_AUTO_SYNC_INITIAL_DELAY_MS:120000}
mercadolivre.retry.max-attempts=${MERCADOLIVRE_RETRY_MAX_ATTEMPTS:3}
mercadolivre.retry.initial-backoff-ms=${MERCADOLIVRE_RETRY_INITIAL_BACKOFF_MS:500}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,https://justock.com.br}